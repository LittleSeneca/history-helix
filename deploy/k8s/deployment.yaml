apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: history-helix
    app.kubernetes.io/part-of: history-helix
  name: history-helix
  namespace: history-helix
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: history-helix
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: history-helix
        app.kubernetes.io/part-of: history-helix
    spec:
      containers:
        - name: history-helix
          image: ghcr.io/littleseneca/history-helix:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30