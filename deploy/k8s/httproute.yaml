apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: history-helix
  namespace: history-helix
spec:
  hostnames:
    - helix.brooks-security.com
    - spiral.brooks-security.com
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: edge
      namespace: kube-system
      sectionName: web
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: history-helix
          port: 80
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /